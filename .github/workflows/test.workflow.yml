name: Tests

on:
  push:
    branches:
      - main
    paths:
      - include/**
      - tests/**
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:
    inputs:
      SDL_VERSION:
        description: "SDL version"
        required: false
        default: "3.4.14"
      SDL_IMAGE_VERSION:
        description: "SDL_image version"
        required: false
        default: "3.4.4"
      SDL_TTF_VERSION:
        description: "SDL_ttf version"
        required: false
        default: "3.2.2"
      SDL_MIXER_VERSION:
        description: "SDL_mixer version"
        required: false
        default: "3.2.4"

jobs:
  tests:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    strategy:
      matrix:
        include:
          - SDL_VERSION: 3.4.14
            SDL_IMAGE_VERSION: 3.4.4
            SDL_TTF_VERSION: 3.2.2
            SDL_MIXER_VERSION: 3.2.4

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SDL dependencies
        uses: HandcrankEngine/install-sdl-packages@3dd8adf2ce1e6698313aecb05a2f8fa59be27b8c # v0.4.1
        with:
          SDL_VERSION: ${{ inputs.SDL_VERSION || matrix.SDL_VERSION }}
          SDL_IMAGE_VERSION: ${{ inputs.SDL_IMAGE_VERSION || matrix.SDL_IMAGE_VERSION }}
          SDL_TTF_VERSION: ${{ inputs.SDL_TTF_VERSION || matrix.SDL_TTF_VERSION }}
          SDL_MIXER_VERSION: ${{ inputs.SDL_MIXER_VERSION || matrix.SDL_MIXER_VERSION }}

      - name: Run tests
        run: ./bin/run-tests.sh
